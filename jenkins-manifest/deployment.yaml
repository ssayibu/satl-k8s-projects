apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins
  namespace: ci-pipelines
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jenkins
  template:
    metadata:
      labels:
        app: jenkins
    spec:
      containers:
        - name: jenkins
          image: jenkins/jenkins:2.544-alpine
          ports:
            - containerPort: 8080
